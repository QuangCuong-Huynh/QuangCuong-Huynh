name: Collect Reports List

on:
  workflow_dispatch:
  push:
    paths:
      - "projects-list.txt"   # trigger when key-value data file changes

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Parse key-value file & download READMEs
        shell: bash
        run: |
          mkdir -p reports
      
          while IFS='=' read -r name repo; do
            [[ -z "$name" ]] && continue
            [[ "$name" =~ ^# ]] && continue
            echo "Processing: $name"
            echo "Repo URL: $repo"
      
            # Convert GitHub URL to raw URL
            raw_url=$(echo "$repo" | sed -E 's|github.com/|raw.githubusercontent.com/|; s|/blob/|/|')
            echo "Raw URL: $raw_url"
      
            # Download README into reports folder
            mkdir -p "reports/$name"
            curl -fL "$raw_url" -o "reports/{$name}.md" \
              || echo "Failed to download README for $name"
          done < projects-list.txt

      - name: Commit updated reports
        run: |
          git config --global user.name "auto-bot"
          git config --global user.email "bot@example.com"
          git fetch
          git add reports
          git commit -m "Auto update reports" || echo "No changes"
          git pull
          git push
